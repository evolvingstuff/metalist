[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metalist"
dynamic = ["version"]
description = "A minimalist single-user note-taking app with SSR, fast in-memory tree operations, and efficient sync."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "argon2-cffi==23.1.0",
    "cryptography==50.0.0",
    "fastapi==0.141.1",
    "latex2mathml==3.81.0",
    "loguru==0.7.2",
    "Mako==1.3.12",
    "mutagen==1.47.0",
    "pydantic==2.9.2",
    "python-multipart==0.0.32",
    "starlette==1.3.1",
    "tree-sitter==0.25.2",
    "tree-sitter-javascript==0.25.0",
    "uvicorn==0.27.1",
]

[project.urls]
Homepage = "https://github.com/evolvingstuff/metalist"
Repository = "https://github.com/evolvingstuff/metalist"
Issues = "https://github.com/evolvingstuff/metalist/issues"

[project.optional-dependencies]
dev = [
    "hypothesis==6.112.0",
    "pytest==8.0.0",
    "pytest-cov==4.1.0",
]

[project.scripts]
metalist = "main:cli"
metalist-mcp = "mcp_client:main"
metalist-audit-encryption = "app.encryption_audit:cli"

[tool.setuptools]
include-package-data = true
py-modules = ["main", "mcp_client"]
script-files = ["convert-from-legacy.py", "scripts/generate-lan-cert.sh"]

[tool.setuptools.dynamic]
version = {attr = "app.version.__version__"}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.exclude-package-data]
app = [
    ".DS_Store",
    "static/.DS_Store",
    "static/js/.DS_Store",
]

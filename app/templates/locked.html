<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>${page_title}</title>
    <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico?v=${asset_version}">
    <link rel="stylesheet" href="/static/css/main.css?v=${asset_version}">
</head>
<body style="margin: 0;">
    <!-- The login screen's look (main.css .login-page), with the logo complete. -->
    <div class="login-page" style="display: flex;">
        <div class="login-stage">
            <div class="login-logo">
                <%include file="_logo_mark.html"/>
            </div>
            <div id="locked-panel" class="login-panel locked-panel">
                <h1>Session locked</h1>
                % if has_password:
                    <button id="locked-action" data-target="login">Go to Login</button>
                % else:
                    <button id="locked-action" data-target="resume">Take Over Session</button>
                % endif
            </div>
        </div>
    </div>
    <script nonce="${request.state.csp_nonce}">
        window.__METALIST_LOCKED__ = {
            hasPassword: ${'true' if has_password else 'false'}
        };
    </script>
    <script type="module" src="/static/js/locked.js?v=${asset_version}"></script>
</body>
</html>

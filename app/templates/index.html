<%inherit file="base.html"/>

<!-- Login Page (full screen, not modal) -->
<div id="login-page" class="login-page" style="display: none;">
    <div class="login-container">
        <h1>MetaList</h1>
        <h2>Authentication Required</h2>
        <form id="login-form">
            <input type="password" id="login-password" placeholder="Enter password" autofocus>
            <button type="submit">Login</button>
            <div id="login-error" class="error-message" style="display: none;"></div>
        </form>
    </div>
</div>

<!-- Password Management Modal will be dynamically created when needed -->

<!-- Main App (hidden when login required) -->
<div id="main-app" style="display: block;">
    <div class="global-controls">
        <button class="menu-button interactive">≡</button>
    </div>
    <div id="tab-indicator">0</div>
    <div id="search-contexts-list"></div>
    <div id="app">
        <div class="container">
            <div class="controls">
                <!-- <button class="add-note interactive">+</button> -->
                <input type="text" id="search-input" class="search-input interactive" placeholder="Search notes...">
                <!-- <button id="trash-can" class="trash-can interactive" draggable="false">🗑️</button> -->
            </div>
            <div id="notes-container">
                % if not needs_auth and 'notes' in locals():
                    <%include file="notes_list.html"/>
                % endif
            </div>
        </div>
    </div>
</div>
